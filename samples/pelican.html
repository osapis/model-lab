<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海岸骑行 · Pelican on wheels</title>
  <style>
    :root { color-scheme: light; --ink: #283f3b; --cream: #fbf8ec; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 28px; background: var(--cream); color: var(--ink); font-family: "Avenir Next", Avenir, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1080px, 100%); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 0 4px 24px; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 750; letter-spacing: .13em; }
    .brand i { width: 10px; height: 10px; border-radius: 50%; background: #e69b55; box-shadow: 0 0 0 5px #edddc3; }
    .edition { font-size: 11px; letter-spacing: .15em; color: #76877c; }
    .artboard { position: relative; overflow: hidden; border-radius: 28px; background: #e3ece0; box-shadow: 0 18px 50px #31473b0c; }
    .caption { position: absolute; top: 40px; left: 42px; z-index: 1; pointer-events: none; }
    .eyebrow { font-size: 10px; font-weight: 700; letter-spacing: .23em; color: #6d8373; }
    h1 { margin: 12px 0 10px; font-size: clamp(24px, 4vw, 46px); font-weight: 600; letter-spacing: -.05em; line-height: 1.18; }
    .caption p { margin: 0; font-size: 12px; color: #738477; letter-spacing: .08em; }
    svg { display: block; width: 100%; height: auto; }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 24px 4px 0; font-size: 11px; color: #809084; letter-spacing: .06em; }
    .signature { font-family: Georgia, serif; font-style: italic; font-size: 17px; color: #526a5b; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin 1.6s linear infinite; }
    .rider { animation: bob .8s ease-in-out infinite; }
    .scarf { transform-origin: 486px 258px; animation: flutter .8s ease-in-out infinite alternate; }
    .cloud { animation: drift 18s ease-in-out infinite alternate; }
    .cloud.far { animation-duration: 25s; animation-direction: alternate-reverse; }
    .road { animation: road 1.6s linear infinite; }
    .plant { animation: road-long 7s linear infinite; }
    .shadow { transform-origin: 545px 625px; animation: shadow .8s ease-in-out infinite; }
    .spark { transform-origin: center; transform-box: fill-box; animation: twinkle 3s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes flutter { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
    @keyframes drift { to { transform: translateX(-28px); } }
    @keyframes road { to { transform: translateX(-200px); } }
    @keyframes road-long { from { transform: translateX(200px); } to { transform: translateX(-1050px); } }
    @keyframes shadow { 50% { transform: scaleX(.985); opacity: .7; } }
    @keyframes twinkle { 50% { transform: scale(.7); opacity: .5; } }
    @media (max-width: 600px) { body { padding: 18px; } header { padding-bottom: 18px; } .brand { font-size: 10px; } .edition { font-size: 9px; } .caption { top: 23px; left: 24px; } .eyebrow { font-size: 7px; } h1 { margin: 7px 0; font-size: 24px; } .caption p { font-size: 8px; } .artboard { border-radius: 20px; } footer { padding-top: 18px; font-size: 9px; } .signature { font-size: 13px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } .pedal-motion { display: none; } .pedal-static { display: inline; } }
    @media (prefers-reduced-motion: no-preference) { .pedal-static { display: none; } }
  </style>
</head>
<body>

    <header><div class="brand"><i aria-hidden="true"></i> LITTLE WANDERERS</div><span class="edition">ANIMATED POSTCARD / 001</span></header>
