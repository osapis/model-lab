name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck:cloudflare
      - run: npm run build:cloudflare
      - run: npm run test:cloudflare
      - name: Test deployment tools
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build Docker image
        run: docker build --tag model-lab:ci .
      - name: Verify Docker installation and backups
        run: python3 tools/docker-smoke.py --image model-lab:ci
  publish-image:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Log in to GitHub Container Registry
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push tagged image
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${IMAGE_REPOSITORY,,}"
          docker build --tag "$image:$IMAGE_TAG" .
          docker push "$image:$IMAGE_TAG"
